{% extends "base-login.html" %}
{% load static %}

{% block content %}

<div class="background-decor">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
</div>

<div class="main-wrapper mx-auto">

    <!-- HEADER -->
    <header class="text-center mb-4">
        <div class="logo-wrap rounded-circle overflow-hidden mx-auto mb-2">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-100 h-100 object-fit-cover">
        </div>
        <h1 class="brand-name text-white">CHICHA BARBER</h1>
        <span class="brand-sub small text-uppercase text-white">Studio · Nobsa</span>
    </header>

    <!-- LOGIN -->
    <main class="form-box p-4 rounded-3">
        <h2 class="form-heading text-white mb-1">Inicia Sesión</h2>
        <p class="small text-white opacity-50 mb-3">Bienvenido a la experiencia premium</p>

        <form method="post" id="form-login">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <!-- EMAIL -->
            <label class="form-label cb-label">Correo Electrónico</label>
            <div class="position-relative mb-1">
                <span class="input-icon">✉️</span>
                <input
                    type="email"
                    name="username"
                    id="id_username"
                    class="cb-input"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="text-danger small mb-2" id="err-username"></div>

            <!-- PASSWORD -->
            <label class="form-label cb-label">Contraseña</label>
            <div class="position-relative mb-2">
                <span class="input-icon">🔒</span>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="cb-input"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
                <button type="button" class="pwd-toggle-btn" id="toggle-password" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <!-- RECUPERAR -->
            <div class="text-end mb-1">
                <a href="{% url 'password_reset' %}" class="forgot-link">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="btn btn-auth w-100 mt-3">
                INGRESAR
            </button>
        </form>
    </main>

</div>

<style>
    /* Tarjeta del formulario: menos negra, más "vidrio esmerilado" */
    .form-box {
        background: rgba(35, 40, 50, 0.72) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Inputs: fondo más claro y con mejor contraste */
    .cb-input {
        background-color: rgba(255, 255, 255, 0.10) !important;
        border: 1px solid rgba(255, 255, 255, 0.18) !important;
        color: #ffffff !important;
    }
    .cb-input::placeholder {
        color: rgba(255, 255, 255, 0.55) !important;
    }
    .cb-input:focus {
        background-color: rgba(255, 255, 255, 0.16) !important;
        border-color: #29b6d8 !important;
        box-shadow: 0 0 0 0.2rem rgba(41, 182, 216, 0.25) !important;
    }

    /* Oculta el ojito nativo de Edge para que no se duplique con el nuestro */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
        display: none;
    }

    /* Ojito para mostrar/ocultar contraseña */
    .pwd-toggle-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        padding: 0;
        line-height: 1;
        cursor: pointer;
    }
    .pwd-toggle-btn:hover {
        color: #ffffff;
    }
    #id_password.cb-input {
        padding-right: 2.5rem;
    }
</style>

<!-- 🔥 NUEVO: Script para evitar espacios o mayúsculas incorrectas en tiempo real -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const inputEmail = document.getElementById('id_username');
    const inputPassword = document.getElementById('id_password');

    // Control de formato para el correo
    if (inputEmail) {
        inputEmail.addEventListener('input', function() {
            this.value = this.value.toLowerCase().replace(/\s/g, '');
        });
    }

    // Validación de dominio completo (evita correo@dominio.c, exige mínimo 2 letras tras el punto)
    const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/;
    const errUsername = document.getElementById('err-username');

    function validarEmail() {
        const valor = inputEmail.value.trim();
        if (valor === '') {
            errUsername.textContent = '';
            return true;
        }
        if (!RE_EMAIL.test(valor)) {
            errUsername.textContent = 'Ingresa un correo completo y válido (ej: nombre@dominio.com).';
            return false;
        }
        errUsername.textContent = '';
        return true;
    }

    if (inputEmail) {
        inputEmail.addEventListener('input', validarEmail);
        inputEmail.addEventListener('blur', validarEmail);
    }

    const formLogin = document.getElementById('form-login');
    if (formLogin) {
        formLogin.addEventListener('submit', function (e) {
            if (!validarEmail()) {
                e.preventDefault();
                inputEmail.focus();
            }
        });
    }

    // Control de formato para la contraseña (sin espacios accidentales)
    if (inputPassword) {
        inputPassword.addEventListener('input', function() {
            this.value = this.value.replace(/\s/g, '');
        });
    }

    // Ojito: mostrar/ocultar contraseña
    const toggleBtn = document.getElementById('toggle-password');
    if (toggleBtn && inputPassword) {
        toggleBtn.addEventListener('click', function () {
            const mostrar = inputPassword.type === 'password';
            inputPassword.type = mostrar ? 'text' : 'password';
            const icono = toggleBtn.querySelector('i');
            icono.classList.toggle('bi-eye', !mostrar);
            icono.classList.toggle('bi-eye-slash', mostrar);
        });
    }
});
</script>

{% endblock content %}
